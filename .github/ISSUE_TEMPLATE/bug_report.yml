name: Bug report
description: Report a defect in markdown parsing, style resolution, or DOCX rendering.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Include a minimal markdown + sidecar example when possible so the issue is easy to reproduce.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and the incorrect behavior.
      placeholder: The generated DOCX drops the footer border when...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Paste the smallest markdown and sidecar example that reproduces the issue.
      render: markdown
      placeholder: |
        Markdown:
        <!-- docx:id=example -->
        ...

        Sidecar:
        document:
          ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The generated DOCX should...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `mdc --version` or the installed package version.
      placeholder: 0.1.0
  - type: dropdown
    id: scope
    attributes:
      label: Where does the bug appear?
      options:
        - Markdown parsing
        - Sidecar loading / inheritance
        - Style resolution
        - DOCX rendering
        - CLI / help text
        - Other
    validations:
      required: true
