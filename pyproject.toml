[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-docx-compiler"
version = "0.1.0"
description = "Layout-aware markdown to DOCX compiler optimized for Google Docs import."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Zequn Li" }
]
dependencies = [
  "markdown-it-py>=3.0,<5.0",
  "python-docx>=1.1,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
fireworks = ["mdc-fireworks-templates>=0.1"]
templates = ["mdc-fireworks-templates>=0.1"]

[project.scripts]
mdc = "markdown_docx_compiler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_docx_compiler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["markdown_docx_compiler"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["markdown_it.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20250915",
    "mdc-fireworks-templates",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mdc-fireworks-templates = { workspace = true }
