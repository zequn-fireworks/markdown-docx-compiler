[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-docx-compiler"
version = "0.1.0"
description = "AI-native, agent-friendly markdown to DOCX compiler for polished editable docs, Google Docs handoff, and PDF-ready workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Zequn Li" }
]
keywords = ["markdown", "docx", "pdf", "google-docs", "document-generation", "python-docx", "ai", "agent", "cli", "automation", "deep-research"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "markdown-it-py>=3.0,<5.0",
  "python-docx>=1.1,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
mdc = "markdown_docx_compiler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_docx_compiler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["markdown_docx_compiler"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["markdown_it.*"]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/zequn-fireworks/markdown-docx-compiler"
Documentation = "https://github.com/zequn-fireworks/markdown-docx-compiler#readme"
Repository = "https://github.com/zequn-fireworks/markdown-docx-compiler"
Issues = "https://github.com/zequn-fireworks/markdown-docx-compiler/issues"
Examples = "https://github.com/zequn-fireworks/markdown-docx-compiler/tree/main/examples"
Changelog = "https://github.com/zequn-fireworks/markdown-docx-compiler/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20250915",
]
