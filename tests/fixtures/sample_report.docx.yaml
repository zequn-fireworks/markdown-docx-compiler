document:
  font:
    family: Aptos
    size: 10.5
    color: "111827"

page_footer:
  font: { size: 8, color: "6B7280" }
  border:
    top: { color: "D1D5DB", width: 1, style: single }

defaults:
  paragraph:
    spacing: { after: 6, line: 1.25 }
  table:
    table: { header_row: true }
  code:
    background: "F3F4F6"
  blockquote:
    font: { italic: true, color: "6B7280" }
    border:
      left: { color: "94A3B8", width: 3 }

blocks:
  results-table:
    type: table
    table: { columns: [3fr, 1fr, 1fr] }
    background: "EFF6FF"
    border:
      top: { color: "93C5FD" }
      bottom: { color: "93C5FD" }
      left: { color: "93C5FD" }
      right: { color: "93C5FD" }
