document:
  font:
    family: Arial
    size: 10.5
    color: "202124"
  link:
    color: "1a73e8"
  page:
    margin: { top: 0.8, bottom: 0.75, left: 1.0, right: 1.0 }

page_header:
  image: { width: "1.8in" }

page_footer:
  font: { size: 8, color: "5F6368" }

doc_header:
  font: { size: 9, color: "5F6368" }

defaults:
  paragraph:
    spacing: { after: 6, line: 1.15 }
  table:
    table: { header_row: true }
    border:
      top: { color: "DADCE0" }
      bottom: { color: "DADCE0" }
      left: { color: "DADCE0" }
      right: { color: "DADCE0" }

blocks:
  comp-table:
    type: table
    table: { columns: [1fr, 3fr] }
    spacing: { before: 8, after: 12 }
