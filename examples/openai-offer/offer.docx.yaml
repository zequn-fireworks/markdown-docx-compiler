document:
  font:
    family: Helvetica Neue
    size: 10.5
    color: "0D0D0D"
  link:
    color: "0D0D0D"
  page:
    margin: { top: 0.8, bottom: 0.75, left: 1.0, right: 1.0 }

page_header:
  image: { width: "2.0in" }

doc_header:
  font: { size: 9, color: "6E6E80" }

defaults:
  paragraph:
    spacing: { after: 6, line: 1.15 }
  table:
    table: { header_row: true }
    border:
      top: { color: "C5C5D2" }
      bottom: { color: "C5C5D2" }
      left: { color: "C5C5D2" }
      right: { color: "C5C5D2" }

blocks:
  comp-table:
    type: table
    table: { columns: [1fr, 3fr] }
    spacing: { before: 8, after: 12 }
