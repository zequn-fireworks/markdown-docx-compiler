[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdc-fireworks-templates"
version = "0.1.0"
description = "Fireworks AI templates for markdown-docx-compiler."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.entry-points."mdc.templates"]
fireworks = "mdc_fireworks_templates:TEMPLATE_DIR"

[tool.hatch.build.targets.wheel]
packages = ["src/mdc_fireworks_templates"]

[tool.hatch.build.targets.wheel.force-include]
"src/mdc_fireworks_templates/brand.yaml" = "mdc_fireworks_templates/brand.yaml"
"src/mdc_fireworks_templates/default.yaml" = "mdc_fireworks_templates/default.yaml"
"src/mdc_fireworks_templates/rca.yaml" = "mdc_fireworks_templates/rca.yaml"
